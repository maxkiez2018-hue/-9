<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พจนานุกรม</title>
<meta name="theme-color" content="#070a12">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070a12;--card:rgba(255,255,255,.045);--gold:#e8c968;--gold2:#b8923a;--line:rgba(232,201,104,.3);--tx:#ffffff;--sub:#c9d0dc;--teal:#4fe0b5;--ok:#0f8a5a;--no:#8f1f42;--no2:#ff7a9c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);background:radial-gradient(1200px 600px at 50% -10%,#1b2342 0%,#0b1020 45%,#070a12 100%) fixed;font-family:"Prompt",system-ui,-apple-system,"Noto Sans Thai",sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;padding:14px 14px 24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:10px}
.ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--gold);font-size:20px;flex:none}
.tt{flex:1;min-width:0}.tt small{display:block;color:var(--sub);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1px solid var(--line);background:var(--card);color:var(--gold);border-radius:99px;padding:10px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.hero{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:800;font-size:46px;line-height:1.12;text-align:center;color:var(--gold);text-shadow:0 0 22px rgba(232,201,104,.35);margin:26px 0 6px;word-break:break-word}
.ph{text-align:center;color:#fff;font-size:17px;opacity:.95;margin-bottom:4px}
.cnt{text-align:center;color:var(--sub);font-size:14px;margin-top:8px}.cnt b{color:#fff}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:12px 0 16px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 16px}
.stat .l{color:var(--sub);font-size:14px}.stat .v{font-size:28px;font-weight:700;margin-top:2px}.stat .v small{font-size:14px;font-weight:400;color:var(--sub)}
.g{color:var(--teal)}.r{color:var(--no2)}
.card{border:1px solid var(--line);background:var(--card);border-radius:26px;padding:18px;text-align:center;margin-bottom:14px}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:14px;color:#fff}
.acts{display:flex;gap:10px;justify-content:center;margin:16px 0}
.chip{border:1px solid var(--line);border-radius:99px;padding:11px 20px;font-weight:600;background:rgba(255,255,255,.06);color:#fff}
.tr{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(0,0,0,.25)}
.tr small{display:block;color:var(--sub);font-size:13px;margin-bottom:6px}.tr b{font-size:25px;color:#fff;font-weight:600}
.mic{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold);margin:22px auto 10px;display:flex;align-items:center;justify-content:center;font-size:34px;background:rgba(0,0,0,.3)}
.mic.on{background:var(--no);border-color:var(--no2);animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(255,122,156,.22)}}
.hint{color:var(--sub);font-size:14px;min-height:20px}
.res{margin-top:10px;border-radius:14px;padding:10px 12px;font-size:15px;color:#fff}
.res.ok{background:rgba(79,224,181,.2)}.res.near{background:rgba(232,201,104,.22)}.res.bad{background:rgba(255,122,156,.2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border-radius:18px;padding:18px;font-size:19px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.18)}
.big.ok{background:var(--ok)}.big.no{background:var(--no)}
.foot{margin-top:14px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
.foot button{color:var(--gold);font-weight:700;white-space:nowrap}
.go{display:block;width:100%;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1405;border-radius:16px;padding:16px;font-size:18px;font-weight:700}
.back{display:block;width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;font-weight:600;color:var(--gold)}
.ttl{text-align:center;font-family:"Playfair Display",Georgia,serif;font-size:30px;font-weight:700;color:var(--gold);margin:22px 0 12px}
ul{padding-left:20px;margin:8px 0;text-align:left}li{margin:8px 0;color:#fff}
.sub{color:var(--sub);font-size:14px}.st{font-size:15px;color:#fff}.st{white-space:nowrap}.tt .st b{display:inline;font-size:17px;overflow:visible}.warn{color:var(--no2);font-size:14px;margin:8px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:#0e1426;border:1px solid var(--line);border-radius:24px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.md h3{margin:0 0 10px;font-size:20px;color:var(--gold)}
.drop{display:block;border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;margin:12px 0;cursor:pointer;color:#fff}
.code{background:rgba(0,0,0,.35);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub);line-height:1.6}
</style>
</head>

function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;

function micMsg(err){
  const n=(err&&err.name)||"error";
  let emb="";try{emb=window.top!==window.self?" · หน้านี้ถูกเปิดซ้อนอยู่ในหน้าต่างอื่น":"";}catch(e){emb=" · หน้านี้ถูกเปิดซ้อนอยู่ในหน้าต่างอื่น";}
  if(n==="NotAllowedError"||n==="SecurityError")return "ไมโครโฟนถูกบล็อก ("+n+")"+emb;
  if(n==="NotFoundError")return "ไม่พบไมโครโฟนในเครื่อง";
  if(n==="NotReadableError")return "ไมโครโฟนถูกแอปอื่นใช้อยู่";
  return "ใช้ไมโครโฟนไม่ได้ ("+n+")"+emb;
}
function answer(rv){
  const w=cur();
  const o=S.w[w.k]||{k:0,u:0,s:"",t:0};
  if(rv==="k")o.k++;else o.u++;
  o.s=rv;o.t=Date.now();S.w[w.k]=o;
  if(mode==="r")ri++;else S.pos++;
  saveOk=save();resetMic();render();
}
function doneN(){
  $.innerHTML=topBar()+`<div class="ttl">เรียนครบทุกคำแล้ว</div>
  <button class="go" onclick="restart()">เริ่มจากคำแรกอีกครั้ง</button>
  <button class="back" onclick="enterReview()">เปิดโหมดทบทวน</button>`;
}
function restart(){S.pos=0;saveOk=save();resetMic();render();}
function enterReview(){rq=S.words.filter(w=>S.w[w.k]&&S.w[w.k].s==="u");ri=0;mode="r";resetMic();render();}
function exitReview(){mode="n";resetMic();render();}
function doneR(){
  const c=counts();
  $.innerHTML=topBar()+`<div class="ttl">${rq.length?"ทบทวนครบแล้ว":"ไม่มีคำที่ต้องทบทวน"}</div>
  ${rq.length&&c.u?`<button class="go" onclick="enterReview()">ทบทวนอีกรอบ (${c.u} คำ)</button>`:""}
  <button class="back" onclick="exitReview()">กลับโหมดปกติ</button>`;
}
saveOk=save();render();
</script>
</body>
